<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAHITICE – Skip The Line</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#c8bdc8;
      --bg2:#e6dce6;
      --ink:#4b3f4b;
      --card: rgba(255,255,255,0.80);
      --shadow: 0 10px 18px rgba(90,60,90,0.16);
      --price:#0a76d5;
      --btn:#7a5a7a;
      --btn2:#6a4d6a;
      --line: rgba(120,90,120,0.18);
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:"Baloo 2", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 600px at 50% 0%, var(--bg2), var(--bg));
      min-height:100vh;
      overflow-x:hidden;
    }

    .top{
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(230,220,230,0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .brandRow{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 10px 12px 6px;
      gap: 10px;
      flex-wrap:nowrap;
    }

    .leftHead{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:6px;
      min-width: 160px;
    }

    .titleBtn{
      border:none;
      background:transparent;
      padding:0;
      margin:0;
      font-weight: 800;
      font-size: 16px;
      letter-spacing:.2px;
      color: var(--ink);
      cursor:pointer;
      white-space:nowrap;
    }

    .backBtn{
      border:none;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(120,90,120,0.25);
      color: var(--ink);
      font-family: "Baloo 2", sans-serif;
      font-weight: 900;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      line-height: 1;
    }

    .cartBtn{
      border:none;
      cursor:pointer;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 6px 14px rgba(90,60,90,0.14);
      color: var(--ink);
      font-weight: 900;
      display:flex;
      align-items:center;
      gap: 8px;
      margin-left:auto;
    }
    .badge{
      min-width: 22px;
      height: 22px;
      border-radius: 999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: var(--btn);
      color:#fff;
      font-size: 12px;
      padding: 0 7px;
    }

    .tabs{
      display:flex;
      gap: 10px;
      padding: 8px 10px 10px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{ display:none; }

    .tab{
      white-space:nowrap;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.55);
      padding: 10px 14px;
      border-radius: 16px;
      font-weight: 900;
      cursor:pointer;
      user-select:none;
      transition: transform .12s ease, background .12s ease;
    }
    .tab:hover{ transform: translateY(-1px); }
    .tab.active{
      background: rgba(255,255,255,0.92);
      border-color: rgba(120,90,120,0.35);
      box-shadow: 0 8px 16px rgba(90,60,90,0.14);
    }

    .container{
      width: min(980px, 94vw);
      margin: 14px auto 110px;
    }
    .section{
      scroll-margin-top: 120px;
      margin-top: 14px;
      padding-top: 8px;
    }
    .sectionTitle{
      font-size: 22px;
      font-weight: 900;
      margin: 8px 2px 10px;
    }
    .list{
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .card{
      display:grid;
      grid-template-columns: 1fr 86px;
      gap: 12px;
      padding: 12px;
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      border: 1px solid rgba(120,90,120,0.12);
    }
    .name{
      font-weight: 900;
      font-size: 15px;
      line-height: 1.15;
      margin-bottom: 4px;
    }
    .desc{
      opacity:.85;
      font-size: 13px;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .price{
      font-weight: 900;
      color: var(--price);
      font-size: 15px;
    }

    .addBtn{
      border:none;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.88);
      border: 1px solid var(--line);
      font-weight: 900;
      color: var(--btn2);
      white-space:nowrap;
      transition: transform .12s ease;
    }
    .addBtn:active{ transform: translateY(1px); }

    .plus{
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--btn);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      line-height: 1;
    }

    .thumb{
      width: 86px;
      height: 86px;
      border-radius: 16px;
      overflow:hidden;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(120,90,120,0.12);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .thumb .placeholder{
      font-weight:900;
      opacity:.55;
      font-size:12px;
    }

    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(30,20,30,0.35);
      opacity: 0;
      pointer-events:none;
      transition: opacity .2s ease;
      z-index: 90;
    }
    .overlay.show{ opacity:1; pointer-events:auto; }

    .drawer{
      position: fixed;
      top: 0;
      right: 0;
      width: min(420px, 92vw);
      height: 100%;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: -14px 0 30px rgba(0,0,0,0.18);
      transform: translateX(105%);
      transition: transform .25s ease;
      z-index: 100;
      display:flex;
      flex-direction:column;
    }
    .drawer.open{ transform: translateX(0); }

    .drawerHeader{
      padding: 14px 14px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom: 1px solid var(--line);
    }
    .drawerHeader .h{
      font-weight: 900;
      font-size: 18px;
    }
    .closeBtn{
      border:none;
      background: rgba(200,189,200,0.6);
      color: var(--ink);
      font-weight: 900;
      border-radius: 12px;
      padding: 10px 12px;
      cursor:pointer;
    }

    .cartList{
      padding: 12px 14px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      overflow:auto;
      flex:1;
    }

    .cartItem{
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(120,90,120,0.14);
      background: rgba(230,220,230,0.35);
    }
    .cartItem .cn{ font-weight:900; }
    .cartItem .cp{ color:var(--price); font-weight:900; }
    .cartItem .flv{ opacity:.85; font-weight:800; font-size:13px; margin-top:2px; }

    .qty{
      display:flex;
      align-items:center;
      gap: 8px;
    }
    .qBtn{
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.85);
      cursor:pointer;
      font-weight: 900;
      color: var(--ink);
    }
    .qNum{ min-width: 22px; text-align:center; font-weight:900; }

    .drawerFooter{
      border-top: 1px solid var(--line);
      padding: 12px 14px 16px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }
    .totalRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-weight: 900;
      font-size: 16px;
    }
    .checkout{
      border:none;
      cursor:pointer;
      padding: 14px 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, #7a5a7a, #6a4d6a);
      color:#fff;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 10px 18px rgba(90,60,90,0.22);
    }
    .clear{
      border:none;
      cursor:pointer;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(200,189,200,0.55);
      color: var(--ink);
      font-weight: 900;
    }

    .flv-overlay{
      position: fixed;
      inset: 0;
      background: rgba(30,20,30,0.35);
      opacity: 0;
      pointer-events:none;
      transition: opacity .2s ease;
      z-index: 120;
    }
    .flv-overlay.show{ opacity:1; pointer-events:auto; }

    .flv-modal{
      position: fixed;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%) scale(0.98);
      width: min(520px, 92vw);
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 130;
      overflow: hidden;
    }
    .flv-modal.show{
      opacity:1;
      pointer-events:auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .flv-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.82);
    }
    .flv-title{ font-weight: 900; font-size: 18px; }
    .flv-close{
      border:none;
      cursor:pointer;
      background: rgba(200,189,200,0.55);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 900;
      color: var(--ink);
    }

    .flv-body{
      padding: 12px 14px 14px;
      max-height: 65vh;
      overflow-y: auto;
      padding-bottom: 110px;
    }
    .flv-sub{ opacity:.85; font-weight: 800; margin-bottom: 10px; }

    .flv-grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .flv-line{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 10px;
      border-radius:16px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.75);
    }
    .flv-name{ font-weight:900; }

    .flv-ctrl{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .flv-mini{
      width:34px;
      height:34px;
      border-radius:12px;
      border:1px solid var(--line);
      background: rgba(255,255,255,0.9);
      cursor:pointer;
      font-weight:900;
      color: var(--ink);
    }
    .flv-count{
      min-width: 20px;
      text-align:center;
      font-weight:900;
    }

    .flv-row{
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid var(--line);
      padding: 10px 12px 12px;
      display:flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }

    .flv-qty{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
    }

    .flv-add{
      border:none;
      cursor:pointer;
      padding: 14px 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, #7a5a7a, #6a4d6a);
      color:#fff;
      font-weight: 900;
      font-size: 15px;
      box-shadow: 0 10px 18px rgba(90,60,90,0.18);
      width: 100%;
    }
    .flv-add:disabled{ opacity:.5; cursor:not-allowed; }

    .flv-hint{ font-weight:800; opacity:.85; text-align:center; }

    .points-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.35);
      display:none;
      z-index:1000;
    }

    .points-modal{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      background:#c8bdc8;
      padding:20px;
      border-radius:20px;
      box-shadow:0 20px 40px rgba(0,0,0,0.3);
      display:none;
      z-index:1001;
      text-align:center;
    }

    .points-input{
      margin-top:10px;
      padding:12px;
      border-radius:12px;
      border:none;
      width:220px;
      font-family:"Baloo 2";
    }

    .points-check-btn{
      margin-top:10px;
      padding:10px 20px;
      border-radius:999px;
      border:none;
      background:#7a5a7a;
      color:white;
      font-weight:800;
      cursor:pointer;
    }

    .points-result{
      margin-top:10px;
      font-weight:800;
    }

    .points-close{
      position:absolute;
      top:8px;
      right:10px;
      background:transparent;
      border:none;
      font-size:22px;
      font-weight:900;
      color:#4b3f4b;
      cursor:pointer;
    }

    @media (max-width:520px){
      .tabs{ gap:8px; padding:6px 8px 8px; }
      .tab{ padding:7px 10px; border-radius:14px; font-size:12px; }

      .card{ grid-template-columns: 1fr 72px; gap:10px; padding:10px; border-radius:16px; }
      .thumb{ width:72px; height:72px; border-radius:14px; }
      .name{ font-size:14px; }
      .desc{ font-size:12px; margin-bottom:6px; }
      .addBtn{ padding:7px 10px; border-radius:12px; font-size:13px; gap:6px; }
      .plus{ width:20px; height:20px; }

      .flv-modal{ top:54%; border-radius:18px; }
      .flv-grid{ gap:8px; }
      .flv-line{ padding:8px; border-radius:14px; }
      .flv-name{ font-size:12.5px; line-height:1.1; }
      .flv-mini{ width:28px; height:28px; border-radius:10px; font-size:14px; }
      .flv-count{ min-width:18px; font-size:13px; }
      .flv-add{ border-radius:16px; font-size:14px; }
      .qBtn{ width:30px; height:30px; border-radius:10px; font-size:16px; }
      .qNum{ font-size:14px; }
    }
  </style>
</head>

<body>
  <div class="top">
    <div class="brandRow">
      <div class="leftHead">
        <button class="titleBtn" type="button" onclick="openCheckPoints()">
          Check My Points
        </button>

        <button class="backBtn" type="button" onclick="goBack()">
          ← Πίσω
        </button>
      </div>

      <button class="cartBtn" id="openCartBtn" type="button">
        Καλάθι <span class="badge" id="cartCount">0</span>
      </button>
    </div>

    <div class="tabs">
      <div class="tab active" data-target="sec-lava">ΛΑΒΑ ΦΙΣΤΙΚΙ</div>
      <div class="tab" data-target="sec-pagota">ΠΑΓΩΤΑ</div>
      <div class="tab" data-target="sec-stevia">STEVIA ΠΑΓΩΤΟ</div>
      <div class="tab" data-target="sec-fruity">ΓΙΑΟΥΡΤΙ ΜΕ ΦΡΟΥΤΑ</div>
      <div class="tab" data-target="sec-fruity-stevia">STEVIA ΠΑΓΩΤΟ ΓΙΑΟΥΡΤΙ</div>
      <div class="tab" data-target="sec-xonakia">ΧΩΝΑΚΙΑ</div>
      <div class="tab" data-target="sec-milkshakes">MILKSHAKES</div>
      <div class="tab" data-target="sec-pota">ΠΟΤΑ</div>
    </div>
  </div>

  <main class="container">
    <section class="section" id="sec-lava">
      <div class="sectionTitle">ΛΑΒΑ ΦΙΣΤΙΚΙ</div>
      <div class="list" id="list-lava"></div>
    </section>

    <section class="section" id="sec-pagota">
      <div class="sectionTitle">ΠΑΓΩΤΑ</div>
      <div class="list" id="list-pagota"></div>
    </section>

    <section class="section" id="sec-stevia">
      <div class="sectionTitle">STEVIA ΠΑΓΩΤΟ</div>
      <div class="list" id="list-stevia"></div>
    </section>

    <section class="section" id="sec-fruity">
      <div class="sectionTitle">ΓΙΑΟΥΡΤΙ ΜΕ ΦΡΟΥΤΑ</div>
      <div class="list" id="list-fruity"></div>
    </section>

    <section class="section" id="sec-fruity-stevia">
      <div class="sectionTitle">STEVIA ΠΑΓΩΤΟ ΓΙΑΟΥΡΤΙ</div>
      <div class="list" id="list-fruity-stevia"></div>
    </section>

    <section class="section" id="sec-xonakia">
      <div class="sectionTitle">ΧΩΝΑΚΙΑ</div>
      <div class="list" id="list-xonakia"></div>
    </section>

    <section class="section" id="sec-milkshakes">
      <div class="sectionTitle">MILKSHAKES</div>
      <div class="list" id="list-milkshakes"></div>
    </section>

    <section class="section" id="sec-pota">
      <div class="sectionTitle">ΠΟΤΑ</div>
      <div class="list" id="list-pota"></div>
    </section>
  </main>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawerHeader">
      <div class="h">Η παραγγελία μου</div>
      <button class="closeBtn" id="closeCartBtn" type="button">Κλείσιμο</button>
    </div>

    <div class="cartList" id="cartList"></div>

    <div class="drawerFooter">
      <div class="totalRow">
        <span>Σύνολο</span>
        <span id="cartTotal">€0,00</span>
      </div>
      <button class="checkout" type="button" id="checkoutBtn">Συνέχεια / Checkout</button>
      <button class="clear" type="button" id="clearBtn">Καθαρισμός καλαθιού</button>
    </div>
  </aside>

  <div class="flv-overlay" id="flvOverlay"></div>

  <div class="flv-modal" id="flvModal" role="dialog" aria-modal="true">
    <div class="flv-head">
      <div class="flv-title" id="flvTitle">Επιλογή</div>
      <button class="flv-close" id="flvClose" type="button">✕</button>
    </div>

    <div class="flv-body">
      <div class="flv-sub" id="flvSub"></div>
      <div class="flv-grid" id="flvFlavors" style="display:none;"></div>
      <div class="flv-grid" id="fruitChoices" style="display:none;"></div>
    </div>

    <div class="flv-row">
      <div class="flv-qty" id="qtyRow">
        <button class="qBtn" id="flvMinus" type="button">-</button>
        <div class="qNum" id="flvQty">1</div>
        <button class="qBtn" id="flvPlus" type="button">+</button>
      </div>

      <button class="flv-add" id="flvAdd" type="button">Προσθήκη στο καλάθι</button>
      <div class="flv-hint" id="flvHint"></div>
    </div>
  </div>

  <div class="points-overlay" id="pointsOverlay"></div>
  <div class="points-modal" id="pointsModal">
    <button class="points-close" type="button" onclick="closePointsModal()">✕</button>

    <h3>Check Points</h3>

    <input type="tel"
           id="pointsPhone"
           class="points-input"
           placeholder="Enter your phone number"
           inputmode="numeric"
           maxlength="8" />

    <button class="points-check-btn" type="button" onclick="checkPoints()">
      Check
    </button>

    <div id="pointsResult" class="points-result"></div>
  </div>

  <script>
    function goBack(){ window.history.back(); }

    function openCheckPoints(){
      document.getElementById("pointsOverlay").style.display="block";
      document.getElementById("pointsModal").style.display="block";

      const phoneInput = document.getElementById("pointsPhone");
      if(phoneInput && !phoneInput.dataset.bound){
        phoneInput.addEventListener("input", function(){
          this.value = this.value.replace(/\D/g,'');
        });
        phoneInput.dataset.bound = "1";
      }
      document.getElementById("pointsResult").innerHTML="";
    }

    function checkPoints(){
      const phone = document.getElementById("pointsPhone").value;
      if(!phone){ alert("Write your phone number"); return; }
      let points = localStorage.getItem("demo_points") || 0;
      document.getElementById("pointsResult").innerHTML = "Your points: " + points + " 🍦";
    }

    function closePointsModal(){
      document.getElementById("pointsOverlay").style.display="none";
      document.getElementById("pointsModal").style.display="none";
    }
    document.getElementById("pointsOverlay").addEventListener("click", closePointsModal);
  </script>

  <script>
    const FLAVORS = ["Βανίλια","Σοκολάτα","Φράουλα","Μαστίχα","Cookies","Φιστίκι","Μπανάνα","Καραμέλα","Γιαούρτι","Stracciatella","Pistachio","Rose Fraise","Melone","Frutty di Bosco","Coffee Mocha","Salted Caramel","After Eight","Pralina"];
    const FRUITS = ["Φρούτα δάσους","Φράουλα","Μπανάνα","Ακτινίδιο","Μάνγκο","Ανανάς"];

    const PRODUCTS = {
      lava: [
        { id:"l1", name:"Λάβα Φιστίκι Αιγίνης", desc:"Πραλίνα φιστικιού με παγωτό και μπισκότο", price:7.00, image:"./images/lava-fistiki.jpeg", qtySelectable:true }
      ],

    function euro(n){ return "€" + n.toFixed(2).replace(".", ","); }
    function allItems(){ return [...PRODUCTS.lava, ...PRODUCTS.pagota, ...PRODUCTS.stevia, ...PRODUCTS.fruity, ...PRODUCTS.fruityStevia, ...PRODUCTS.xonakia, ...PRODUCTS.milkshakes, ...PRODUCTS.pota]; }
    function baseId(key){ return key.split("|")[0]; }
    function flavorText(key){ const p = key.split("|"); return p[1] ? p[1].trim() : ""; }
    function findItem(key){ return allItems().find(x => x.id === baseId(key)); }
    function makeKey(item, labels){
      if(!labels || labels.length === 0) return item.id;
      return item.id + "|" + labels.join(" / ");
    }

    function makeLabelFromCounts(prefix, countsObj){
      const parts = Object.entries(countsObj)
        .filter(([_,c]) => c > 0)
        .map(([name,c]) => `${name} x${c}`);
      return prefix + ": " + (parts.length ? parts.join(" / ") : "(χωρίς)");
    }

    function totalSelected(countsObj){
      return Object.values(countsObj).reduce((a,b)=>a+b,0);
    }

    function cardHTML(item){
      const img = item.image
        ? `<img src="${item.image}" alt="${item.name}">`
        : `<div class="placeholder">IMG</div>`;

      return `
        <div class="card">
          <div>
            <div class="name">${item.name}</div>
            <div class="desc">${item.desc || ""}</div>
            <div class="row">
              <div class="price">${euro(item.price)}</div>
              <button class="addBtn" data-open="${item.id}" type="button">
                <span class="plus">+</span> Επιλογή
              </button>
            </div>
          </div>
          <div class="thumb">${img}</div>
        </div>
      `;
    }

    function render(){
      document.getElementById("list-lava").innerHTML = PRODUCTS.lava.map(cardHTML).join("");
      document.getElementById("list-pagota").innerHTML = PRODUCTS.pagota.map(cardHTML).join("");
      document.getElementById("list-stevia").innerHTML = PRODUCTS.stevia.map(cardHTML).join("");
      document.getElementById("list-fruity").innerHTML = PRODUCTS.fruity.map(cardHTML).join("");
      document.getElementById("list-fruity-stevia").innerHTML = PRODUCTS.fruityStevia.map(cardHTML).join("");
      document.getElementById("list-xonakia").innerHTML = PRODUCTS.xonakia.map(cardHTML).join("");
      document.getElementById("list-milkshakes").innerHTML = PRODUCTS.milkshakes.map(cardHTML).join("");
      document.getElementById("list-pota").innerHTML = PRODUCTS.pota.map(cardHTML).join("");
    }

    const CART_KEY = "pahitice_cart_v4";
    let cart = JSON.parse(localStorage.getItem(CART_KEY) || "{}");

    function saveCart(){
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
      updateCartUI();
    }

    function cartCount(){
      return Object.values(cart).reduce((a,b)=>a+b,0);
    }

    function cartTotal(){
      let total = 0;
      for(const [key,qty] of Object.entries(cart)){
        const it = findItem(key);
        if(it) total += it.price * qty;
      }
      return total;
    }

    function inc(key){ cart[key] = (cart[key] || 0) + 1; saveCart(); }
    function dec(key){
      if(!cart[key]) return;
      cart[key] -= 1;
      if(cart[key] <= 0) delete cart[key];
      saveCart();
    }
    function clearCart(){ cart = {}; saveCart(); }

    function updateCartUI(){
      document.getElementById("cartCount").textContent = cartCount();
      document.getElementById("cartTotal").textContent = euro(cartTotal());

      const list = document.getElementById("cartList");
      const entries = Object.entries(cart);

      if(entries.length === 0){
        list.innerHTML = `<div style="opacity:.75;font-weight:900;padding:8px;">Το καλάθι είναι άδειο.</div>`;
        return;
      }

      list.innerHTML = entries.map(([key,qty])=>{
        const it = findItem(key);
        if(!it) return "";
        const flv = flavorText(key);
        return `
          <div class="cartItem">
            <div>
              <div class="cn">${it.name}</div>
              ${flv ? `<div class="flv">${flv}</div>` : ``}
              <div class="cp">${euro(it.price)}</div>
            </div>
            <div class="qty">
              <button class="qBtn" data-dec="${key}" type="button">-</button>
              <div class="qNum">${qty}</div>
              <button class="qBtn" data-inc="${key}" type="button">+</button>
            </div>
          </div>
        `;
      }).join("");
    }

    document.querySelectorAll(".tab").forEach(tab=>{
      tab.addEventListener("click", ()=>{
        const id = tab.dataset.target;
        document.getElementById(id).scrollIntoView({behavior:"smooth", block:"start"});
      });
    });

    const sections = ["sec-lava","sec-pagota","sec-stevia","sec-fruity","sec-fruity-stevia","sec-xonakia","sec-milkshakes","sec-pota"].map(id=>document.getElementById(id));
    const tabs = [...document.querySelectorAll(".tab")];

    const obs = new IntersectionObserver((entries)=>{
      const visible = entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
      if(!visible) return;
      const active = visible.target.id;
      tabs.forEach(t=>t.classList.toggle("active", t.dataset.target === active));
    }, { threshold:[0.35,0.55,0.7] });

    sections.forEach(s=>obs.observe(s));

    const overlay = document.getElementById("overlay");
    const drawer  = document.getElementById("drawer");

    function openCart(){
      overlay.classList.add("show");
      drawer.classList.add("open");
      updateCartUI();
    }
    function closeCart(){
      overlay.classList.remove("show");
      drawer.classList.remove("open");
    }

    document.getElementById("openCartBtn").addEventListener("click", openCart);
    document.getElementById("closeCartBtn").addEventListener("click", closeCart);
    overlay.addEventListener("click", closeCart);
    document.getElementById("clearBtn").addEventListener("click", clearCart);
    document.getElementById("checkoutBtn").addEventListener("click", ()=>alert("Εδώ μετά βάζουμε checkout/στοιχεία πελάτη."));

    const flvOverlay = document.getElementById("flvOverlay");
    const flvModal   = document.getElementById("flvModal");
    const flvTitle   = document.getElementById("flvTitle");
    const flvSub     = document.getElementById("flvSub");
    const flvFlavors = document.getElementById("flvFlavors");
    const fruitChoices = document.getElementById("fruitChoices");
    const flvHint    = document.getElementById("flvHint");
    const qtyRow     = document.getElementById("qtyRow");
    const flvQtyEl   = document.getElementById("flvQty");
    const flvMinus   = document.getElementById("flvMinus");
    const flvPlus    = document.getElementById("flvPlus");
    const flvAdd     = document.getElementById("flvAdd");
    const flvClose   = document.getElementById("flvClose");

    let currentItem = null;
    let qty = 1;
    let flavorCounts = {};
    let fruitCounts  = {};

    function openOptionsModal(item){
      currentItem = item;
      qty = 1;
      flvQtyEl.textContent = qty;
      flvTitle.textContent = item.name;
      flvHint.textContent = "";
      flvFlavors.innerHTML = "";
      fruitChoices.innerHTML = "";
      flvFlavors.style.display = "none";
      fruitChoices.style.display = "none";

      const hasScoops = item.scoops && item.flavors && item.flavors.length;
      const hasFruits = item.fruits && item.fruits.length;
      const wantsQty  = !!item.qtySelectable;

      qtyRow.style.display = wantsQty ? "flex" : "none";

      if(hasScoops){
        flvSub.textContent = `Διάλεξε ${item.scoops} scoops (μπορείς και ίδια γεύση πολλές φορές)`;
        flvFlavors.style.display = "grid";
        flavorCounts = {};
        item.flavors.forEach(n => flavorCounts[n] = 0);

        item.flavors.forEach(n=>{
          const row = document.createElement("div");
          row.className = "flv-line";
          row.innerHTML = `
            <div class="flv-name">${n}</div>
            <div class="flv-ctrl">
              <button class="flv-mini" type="button" data-flv-minus="${n}">-</button>
              <div class="flv-count" data-flv-count="${n}">0</div>
              <button class="flv-mini" type="button" data-flv-plus="${n}">+</button>
            </div>
          `;
          flvFlavors.appendChild(row);
        });

      } else if(hasFruits){
        const max = item.fruitMax ?? 2;
        flvSub.textContent = `Διάλεξε ${max} φρούτα`;
        fruitChoices.style.display = "grid";
        fruitCounts = {};
        item.fruits.forEach(n => fruitCounts[n] = 0);

        item.fruits.forEach(n=>{
          const row = document.createElement("div");
          row.className = "flv-line";
          row.innerHTML = `
            <div class="flv-name">${n}</div>
            <div class="flv-ctrl">
              <button class="flv-mini" type="button" data-fr-minus="${n}">-</button>
              <div class="flv-count" data-fr-count="${n}">0</div>
              <button class="flv-mini" type="button" data-fr-plus="${n}">+</button>
            </div>
          `;
          fruitChoices.appendChild(row);
        });

      } else {
        flvSub.textContent = wantsQty ? "Διάλεξε ποσότητα:" : "Προσθήκη στο καλάθι";
      }

      validateModal();
      flvOverlay.classList.add("show");
      flvModal.classList.add("show");
    }

    function closeOptionsModal(){
      flvOverlay.classList.remove("show");
      flvModal.classList.remove("show");
    }

    function refreshCountsUI(){
      Object.keys(flavorCounts).forEach(name=>{
        const el = flvFlavors.querySelector(`[data-flv-count="${CSS.escape(name)}"]`);
        if(el) el.textContent = flavorCounts[name];
      });
      Object.keys(fruitCounts).forEach(name=>{
        const el = fruitChoices.querySelector(`[data-fr-count="${CSS.escape(name)}"]`);
        if(el) el.textContent = fruitCounts[name];
      });
    }

    function validateModal(){
      if(!currentItem) return;

      const hasScoops = currentItem.scoops && currentItem.flavors && currentItem.flavors.length;
      const hasFruits = currentItem.fruits && currentItem.fruits.length;

      if(hasScoops){
        const need = currentItem.scoops;
        const have = totalSelected(flavorCounts);
        flvAdd.disabled = have !== need;
        flvHint.textContent = (have !== need) ? `Έχεις βάλει ${have}/${need} scoops.` : "";

      } else if(hasFruits){
        const need = currentItem.fruitMax ?? 2;
        const have = totalSelected(fruitCounts);
        flvAdd.disabled = have !== need;
        flvHint.textContent = (have !== need) ? `Έχεις βάλει ${have}/${need} φρούτα.` : "";

      } else {
        flvAdd.disabled = false;
        flvHint.textContent = "";
      }
    }

    flvMinus.addEventListener("click", ()=>{ qty = Math.max(1, qty-1); flvQtyEl.textContent = qty; });
    flvPlus.addEventListener("click", ()=>{ qty = qty+1; flvQtyEl.textContent = qty; });

    flvClose.addEventListener("click", closeOptionsModal);
    flvOverlay.addEventListener("click", closeOptionsModal);

    flvFlavors.addEventListener("click", (e)=>{
      if(!currentItem) return;
      const hasScoops = currentItem.scoops && currentItem.flavors && currentItem.flavors.length;
      if(!hasScoops) return;

      const need = currentItem.scoops;

      const plus = e.target.closest("[data-flv-plus]")?.dataset.flvPlus;
      if(plus){
        if(totalSelected(flavorCounts) >= need) return;
        flavorCounts[plus] = (flavorCounts[plus] || 0) + 1;
        refreshCountsUI(); validateModal(); return;
      }

      const minus = e.target.closest("[data-flv-minus]")?.dataset.flvMinus;
      if(minus){
        flavorCounts[minus] = Math.max(0, (flavorCounts[minus] || 0) - 1);
        refreshCountsUI(); validateModal(); return;
      }
    });

    fruitChoices.addEventListener("click", (e)=>{
      if(!currentItem) return;
      const hasFruits = currentItem.fruits && currentItem.fruits.length;
      if(!hasFruits) return;

      const need = currentItem.fruitMax ?? 2;

      const plus = e.target.closest("[data-fr-plus]")?.dataset.frPlus;
      if(plus){
        if(totalSelected(fruitCounts) >= need) return;
        fruitCounts[plus] = (fruitCounts[plus] || 0) + 1;
        refreshCountsUI(); validateModal(); return;
      }

      const minus = e.target.closest("[data-fr-minus]")?.dataset.frMinus;
      if(minus){
        fruitCounts[minus] = Math.max(0, (fruitCounts[minus] || 0) - 1);
        refreshCountsUI(); validateModal(); return;
      }
    });

    flvAdd.addEventListener("click", ()=>{
      if(!currentItem) return;

      const hasScoops = currentItem.scoops && currentItem.flavors && currentItem.flavors.length;
      const hasFruits = currentItem.fruits && currentItem.fruits.length;
      const wantsQty  = !!currentItem.qtySelectable;

      let key = currentItem.id;

      if(hasScoops){
        if(totalSelected(flavorCounts) !== currentItem.scoops) return;
        const label = makeLabelFromCounts("Γεύσεις", flavorCounts);
        key = makeKey(currentItem, [label]);
        cart[key] = (cart[key] || 0) + 1;

      } else if(hasFruits){
        const need = currentItem.fruitMax ?? 2;
        if(totalSelected(fruitCounts) !== need) return;
        const label = makeLabelFromCounts("Φρούτα", fruitCounts);
        key = makeKey(currentItem, [label]);
        cart[key] = (cart[key] || 0) + 1;

      } else {
        const addQty = wantsQty ? qty : 1;
        cart[key] = (cart[key] || 0) + addQty;
      }

      saveCart();
      closeOptionsModal();
    });

    document.addEventListener("click", (e)=>{
      const openId = e.target.closest("[data-open]")?.dataset.open;
      if(openId){
        const item = allItems().find(x => x.id === openId);
        if(item) openOptionsModal(item);
      }

      const incKey = e.target.closest("[data-inc]")?.dataset.inc;
      if(incKey) inc(incKey);

      const decKey = e.target.closest("[data-dec]")?.dataset.dec;
      if(decKey) dec(decKey);
    });

    render();
    updateCartUI();
  </script>
</body>
</html>
