<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirect...</title>

  <!-- ΑΛΛΑΖΕΙΣ ΜΟΝΟ ΑΥΤΟ ΤΟ LINK -->
  <meta http-equiv="refresh" content="0; url=https://yourwebsite.com" />

  <script>
    window.location.replace("https://yourwebsite.com");
  </script>
</head>
<body>
  <p>Redirecting...</p>
  <p>Αν δεν γίνει ανακατεύθυνση, πάτα <a href="https://yourwebsite.com">εδώ</a>.</p>
</body>
</html>
